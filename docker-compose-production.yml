version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: company-assistant-redis
    restart: unless-stopped
    expose:
      - "6379"
    networks:
      - app_net
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: ${DOCKER_USERNAME}/company-assistant-backend:latest
    pull_policy: always
    env_file: ./.env
    expose:
      - "8000"
    environment:
      APP_RESET_DATA: "False"
      REDIS_URL: "redis://redis:6379/0"   # ← points to redis service by name
    volumes:
      - chroma_data:/app/chromadb_multi_tenant
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - app_net
    depends_on:
      redis:                               # ← wait for redis to be healthy
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1200M
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "timeout 1s bash -c ':> /dev/tcp/127.0.0.1/8000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    image: ${DOCKER_USERNAME}/company-assistant-frontend:latest
    networks:
      - app_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  nginx:
    image: nginx:alpine
    container_name: frontend-nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - app_net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

volumes:
  chroma_data:
  redis_data:        # ← persist redis data across restarts

networks:
  app_net:
    driver: bridge