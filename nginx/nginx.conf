# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name askmi.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name askmi.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/askmi.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/askmi.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Frontend
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # ── Long-running: file ingest (MUST be before /api/ block) ────────────
    location ~ ^/api/(google-drive/ingest|ingest|upload) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout   75s;
        proxy_send_timeout      300s;
        proxy_read_timeout      300s;   # ✅ 5 min for Drive download + embedding
        client_max_body_size    100M;
        proxy_buffering         off;
        proxy_request_buffering off;
    }

    # ── SSE streaming (chat) ───────────────────────────────────────────────
    location /api/query/stream {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_read_timeout      600s;   # ✅ 10 min for long LLM responses
        proxy_buffering         off;
        proxy_cache             off;
        chunked_transfer_encoding on;
    }

    # ── General API ────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout   10s;
        proxy_send_timeout      60s;
        proxy_read_timeout      60s;
        client_max_body_size    20M;
        proxy_buffering         off;
    }

    location /docs      { proxy_pass http://backend:8000/docs; }
    location /redoc     { proxy_pass http://backend:8000/redoc; }
    location /openapi.json { proxy_pass http://backend:8000/openapi.json; }
}